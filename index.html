<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS Background</title>
    <!-- Liên kết đến file CSS ngoài -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Tiêu đề chính -->
    <h1>Chào mừng đến với trang web của tôi</h1>

    <!-- Đoạn văn mô tả -->
    <p class="description">
        Trang web này được xây dựng để luyện tập các kỹ thuật xử lý màu nền và hình nền trong CSS, giúp giao diện trở nên sinh động và thu hút hơn.
    </p>

    <!-- Khối div chứa nội dung quan trọng có hình nền -->
    <div class="highlight-box">
        <h2>Khối Nội Dung Quan Trọng</h2>
        <p>Phần này được thiết lập ảnh nền và căn giữa nội dung theo cả chiều ngang lẫn chiều dọc.</p>
    </div>

</body>
</html>
